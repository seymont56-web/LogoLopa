<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Лопа — Лестницы звуков</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="game-root" id="gameRoot">
    <section class="start-screen screen screen--active" id="startScreen" aria-label="Начало игры">
      <button class="start-btn" id="startBtn" type="button">Начать</button>
    </section>

    <section class="novel-screen screen" id="novelScreen" aria-label="Предыстория игры">
      <button class="novel-frame" id="novelFrame" type="button" aria-label="Следующий кадр истории">
        <picture>
          <source id="novelSource" srcset="" media="(orientation: portrait)" />
          <img id="novelImage" src="" alt="Кадр истории" />
        </picture>

        <span class="novel-counter" id="novelCounter">1</span>
        <span class="novel-hint">Нажми, чтобы продолжить</span>
      </button>
    </section>

    <section class="game-screen screen" id="gameScreen" aria-label="Игровое поле">
      <div class="game-bg-shape game-bg-shape--one"></div>
      <div class="game-bg-shape game-bg-shape--two"></div>

      <header class="game-header">
        <div>
          <p class="eyebrow">Игра 5</p>
          <h1>Лестницы звуков</h1>
        </div>

        <div class="level-pill" id="scorePill">0/10</div>
      </header>

      <section class="ladders-area" aria-label="Лестницы для букв">
        <div class="ladder-card ladder-card--hard" data-ladder="hard">
          <div class="ladder-title">Кирпичная лестница</div>
          <div class="ladder-subtitle">Твёрдые гласные</div>
          <div class="ladder-inner" id="hardLadder"></div>
        </div>

        <div class="ladder-card ladder-card--soft" data-ladder="soft">
          <div class="ladder-title">Ватная лестница</div>
          <div class="ladder-subtitle">Мягкие гласные</div>
          <div class="ladder-inner" id="softLadder"></div>
        </div>
      </section>

      <section class="tray-card" aria-label="Карточки с буквами">
        <div class="tray-title">Перетащи буквы на подходящую лестницу</div>
        <div class="tray" id="tray"></div>
      </section>

      <div class="finish-card" id="finishCard" aria-hidden="true">
        <div class="finish-card__icon">🏆</div>
        <h2>Готово!</h2>
        <p id="finishText">Ты разложил все буквы по лестницам.</p>
        <button class="game-btn game-btn--primary" id="restartBtn" type="button">Заново</button>
      </div>
    </section>

    <div class="success-pop" id="successPop" aria-hidden="true">
      <img id="successPopImage" src="../success_img/1.png" alt="" />
    </div>

    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
  </main>

  <script src="game.js"></script>
</body>

</html>
