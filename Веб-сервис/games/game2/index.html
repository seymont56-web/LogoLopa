<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Собери слово — обучающая игра</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --accent: #2563eb;
      --accent-weak: #93c5fd;
      --text: #0f172a;
      --muted: #64748b;
      --tile: #e2e8f0;
      --tile-border: #cbd5e1;
      --slot: #f1f5f9;
      --slot-border: #d1d5db;
      --good: #16a34a;
      --bad: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      color: var(--text);
      background: radial-gradient(1200px 600px at 80% -20%, #e0f2fe 0%, transparent 60%), var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 960px;
      background: var(--panel);
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 20px;
    }

    header {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: 0.2px;
    }

    .score {
      font-weight: 600;
      color: var(--muted);
    }

    .board {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 800px) {
      .board {
        grid-template-columns: 1fr;
      }
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      background: #fff;
    }

    .prompt {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .hint {
      font-size: 18px;
    }

    .imageWrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      border: 2px dashed #e5e7eb;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #f8fafc;
      color: var(--muted);
    }

    .imageWrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .slots {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 14px;
      background: linear-gradient(#fff, #fff) padding-box, linear-gradient(135deg, #e2e8f0, #f8fafc) border-box;
      border: 2px solid transparent;
      border-radius: 14px;
      min-height: 80px;
    }

    .slot {
      width: clamp(44px, 7vw, 62px);
      height: clamp(56px, 9vw, 70px);
      border: 2px dashed var(--slot-border);
      background: var(--slot);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: clamp(20px, 5vw, 32px);
      color: var(--text);
      user-select: none;
    }

    .slot.filled {
      border-style: solid;
      border-color: var(--accent-weak);
      background: #fff;
    }

    .pool {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      min-height: 80px;
    }

    .tile {
      display: grid;
      place-items: center;
      width: clamp(44px, 7vw, 62px);
      height: clamp(56px, 9vw, 70px);
      border-radius: 12px;
      background: var(--tile);
      border: 2px solid var(--tile-border);
      font-weight: 800;
      font-size: clamp(20px, 5vw, 32px);
      cursor: pointer;
      user-select: none;
      transition: transform 120ms ease, box-shadow 120ms ease;
      touch-action: manipulation;
    }

    .tile:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 14px;
    }

    button {
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: #fff;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .msg {
      text-align: center;
      margin-top: 10px;
      font-weight: 700;
    }

    .tile.dragging {
      opacity: 0.5;
      transform: scale(0.95);
    }

    .slot.drag-over {
      border-color: var(--accent);
      background: #dbeafe;
    }

    .msg.good {
      color: var(--good);
    }

    .msg.bad {
      color: var(--bad);
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>Собери слово</h1>
      <div class="score">
        Раунд: <span id="round">1</span> • Очки: <span id="points">0</span>
      </div>
    </header>

    <div class="board">
      <section class="prompt card">
        <div class="hint">Подсказка: <span id="hint">—</span></div>
        <div class="imageWrap" id="imageWrap">Нет изображения</div>
      </section>

      <section class="game card">
        <div class="slots" id="slots"></div>
        <div class="pool" id="pool"></div>

        <div class="controls">
          <button id="btnClear">Очистить</button>
          <button id="btnShuffle">Перемешать буквы</button>
          <button id="btnCheck" class="primary">Проверить</button>
          <button id="btnNext" style="display:none;">Следующее слово</button>
          <button id="btnRestart" style="display:none;">Начать заново</button>
        </div>

        <div class="msg" id="msg"></div>
      </section>
    </div>
  </div>

  <script>
    // --- ID ИГРЫ В БАЗЕ ДАННЫХ ---
    const GAME_ID = 2;

    // --- Утилиты ---
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr;
    }

    function toUpper(str) {
      return (str || '').toLocaleUpperCase('ru-RU');
    }

    // --- Состояние игры ---
    let words = [];
    let order = [];
    let idx = 0;
    let current = null;
    let filled = [];
    let points = 0;
    let round = 1;

    // --- Состояние результатов ---
    let correctAnswers = 0;
    let incorrectAnswers = 0;
    let startTime = null;
    let resultSaved = false;

    // --- DOM ---
    const slotsEl = $('#slots');
    const poolEl = $('#pool');
    const hintEl = $('#hint');
    const imageWrap = $('#imageWrap');
    const msgEl = $('#msg');
    const roundEl = $('#round');
    const pointsEl = $('#points');
    const btnClear = $('#btnClear');
    const btnShuffle = $('#btnShuffle');
    const btnCheck = $('#btnCheck');
    const btnNext = $('#btnNext');
    const btnRestart = $('#btnRestart');

    // --- Загрузка данных ---
    fetch('data.php')
      .then(response => {
        if (!response.ok) {
          throw new Error('data.php не найден или вернул ошибку: ' + response.status);
        }

        return response.json();
      })
      .then(data => {
        words = data;
        startNewGame();
      })
      .catch(error => {
        console.error(error);
        msg('Не удалось загрузить список слов', 'bad');
      });

    // --- Старт игры ---
    function startNewGame() {
      order = shuffle([...Array(words.length)].map((_, i) => i));
      idx = 0;
      current = null;
      filled = [];
      points = 0;
      round = 1;

      correctAnswers = 0;
      incorrectAnswers = 0;
      resultSaved = false;
      startTime = Date.now();

      pointsEl.textContent = points;
      roundEl.textContent = round;

      btnClear.style.display = 'inline-block';
      btnShuffle.style.display = 'inline-block';
      btnCheck.style.display = 'inline-block';
      btnCheck.disabled = false;
      btnNext.style.display = 'none';
      btnRestart.style.display = 'none';

      loadWord();
    }

    // --- Загрузка слова ---
    function loadWord() {
      msg('');

      btnNext.style.display = 'none';
      btnCheck.disabled = false;

      if (idx >= order.length) {
        finishGame();
        return;
      }

      current = words[order[idx]];
      round = idx + 1;
      roundEl.textContent = round;

      hintEl.textContent = current.hint || '—';

      imageWrap.innerHTML = '';

      const img = document.createElement('img');
      img.alt = current.word;
      img.loading = 'lazy';
      img.src = current.image || '';
      img.onerror = () => {
        imageWrap.textContent = 'Нет изображения';
      };

      imageWrap.appendChild(img);

      const lettersCount = current.letters.length;
      filled = Array(lettersCount).fill(null);
      renderSlots();

      const letters = shuffle([...current.letters]);
      renderPool(letters);
    }

    // --- Завершение игры ---
    async function finishGame() {
      const timeSpent = getTimeSpent();

      btnClear.style.display = 'none';
      btnShuffle.style.display = 'none';
      btnCheck.style.display = 'none';
      btnNext.style.display = 'none';
      btnRestart.style.display = 'inline-block';

      slotsEl.innerHTML = '';
      poolEl.innerHTML = '';
      hintEl.textContent = 'Игра завершена';
      imageWrap.textContent = 'Все слова пройдены';

      msg('Игра завершена. Сохраняем результат...', 'good');

      await saveGameResult(timeSpent);
    }

    // --- Подсчёт времени ---
    function getTimeSpent() {
      if (!startTime) {
        return 0;
      }

      return Math.floor((Date.now() - startTime) / 1000);
    }

    // --- Сохранение результата в БД ---
    async function saveGameResult(timeSpent) {
      if (resultSaved) {
        return;
      }

      resultSaved = true;

      try {
        const response = await fetch('../../save_result.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'same-origin',
          body: JSON.stringify({
            game_id: GAME_ID,
            correct_answers: correctAnswers,
            incorrect_answers: incorrectAnswers,
            time_spent: timeSpent
          })
        });

        const data = await response.json();

        if (data.success) {
          msg(
            `Результат сохранён. Правильных ответов: ${correctAnswers}, ошибок: ${incorrectAnswers}, время: ${timeSpent} сек.`,
            'good'
          );
        } else {
          msg(
            `Игра завершена, но результат не сохранён: ${data.message}`,
            'bad'
          );
        }
      } catch (error) {
        msg(
          'Игра завершена, но произошла ошибка при сохранении результата.',
          'bad'
        );
      }
    }

    // --- Отрисовка слотов ---
    function renderSlots() {
      slotsEl.innerHTML = '';

      filled.forEach((ch, i) => {
        const slot = document.createElement('div');

        slot.className = 'slot' + (ch ? ' filled' : '');
        slot.dataset.index = String(i);
        slot.textContent = ch ? ch : '';

        // Возврат буквы из слота в пул по клику
        slot.addEventListener('click', () => {
          if (!filled[i] || btnCheck.disabled) {
            return;
          }

          addTileToPool(filled[i]);
          filled[i] = null;
          renderSlots();
          msg('');
        });

        // Разрешаем перетаскивание буквы в слот
        slot.addEventListener('dragover', (event) => {
          event.preventDefault();

          if (btnCheck.disabled) {
            return;
          }

          slot.classList.add('drag-over');
        });

        slot.addEventListener('dragleave', () => {
          slot.classList.remove('drag-over');
        });

        slot.addEventListener('drop', (event) => {
          event.preventDefault();

          slot.classList.remove('drag-over');

          if (btnCheck.disabled) {
            return;
          }

          const letter = event.dataTransfer.getData('letter');
          const tileId = event.dataTransfer.getData('tile-id');

          if (!letter || !tileId) {
            return;
          }

          if (filled[i]) {
            msg('Этот слот уже занят. Нажми на букву в слоте, чтобы вернуть её назад.', 'bad');
            return;
          }

          filled[i] = letter;

          const tile = document.getElementById(tileId);

          if (tile) {
            tile.remove();
          }

          renderSlots();
          msg('');
        });

        slotsEl.appendChild(slot);
      });
    }
    // --- Отрисовка пула букв ---
    function renderPool(letters) {
      poolEl.innerHTML = '';

      letters.forEach(ch => addTileToPool(ch));
    }

    // --- Добавление буквы в пул ---
    function addTileToPool(ch) {
      const tile = document.createElement('div');

      tile.className = 'tile';
      tile.id = 'tile-' + Math.random().toString(36).substring(2, 10);
      tile.textContent = ch;
      tile.tabIndex = 0;
      tile.draggable = true;

      tile.setAttribute('role', 'button');
      tile.setAttribute('aria-label', 'Буква ' + ch);

      // Перетаскивание буквы
      tile.addEventListener('dragstart', (event) => {
        if (btnCheck.disabled) {
          event.preventDefault();
          return;
        }

        tile.classList.add('dragging');

        event.dataTransfer.setData('letter', ch);
        event.dataTransfer.setData('tile-id', tile.id);
        event.dataTransfer.effectAllowed = 'move';
      });

      tile.addEventListener('dragend', () => {
        tile.classList.remove('dragging');
      });

      // Старый вариант управления по клику оставляем
      const place = () => {
        if (btnCheck.disabled) {
          return;
        }

        const i = filled.findIndex(x => x === null);

        if (i === -1) {
          return;
        }

        filled[i] = ch;
        tile.remove();
        renderSlots();
        msg('');
      };

      tile.addEventListener('click', place);

      tile.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          place();
        }
      });

      poolEl.appendChild(tile);
    }

    // --- Очистка слотов ---
    function clearAll() {
      if (!current || btnCheck.disabled) {
        return;
      }

      const letters = [];

      filled.forEach(ch => {
        if (ch) {
          letters.push(ch);
        }
      });

      $$('.tile').forEach(tile => {
        letters.push(tile.textContent);
      });

      filled = Array(current.letters.length).fill(null);
      renderSlots();
      renderPool(shuffle(letters));
      msg('');
    }

    // --- Перемешивание букв ---
    function shufflePool() {
      if (!current || btnCheck.disabled) {
        return;
      }

      const letters = [];

      $$('.tile').forEach(tile => {
        letters.push(tile.textContent);
      });

      filled.forEach(ch => {
        if (ch) {
          letters.push(ch);
        }
      });

      filled = Array(current.letters.length).fill(null);
      renderSlots();
      renderPool(shuffle(letters));
      msg('');
    }

    // --- Проверка слова ---
    function check() {
      if (!current || btnCheck.disabled) {
        return;
      }

      const attempt = toUpper(filled.join(''));
      const correct = toUpper(current.word);

      if (attempt.length < correct.length) {
        msg('Ещё не все буквы на месте 👀', 'bad');
        return;
      }

      if (attempt === correct) {
        correctAnswers++;

        msg('Правильно! 🎉', 'good');

        points += 10;
        pointsEl.textContent = points;

        btnNext.style.display = 'inline-block';
        btnCheck.disabled = true;

        if (idx === order.length - 1) {
          btnNext.textContent = 'Завершить игру';
        } else {
          btnNext.textContent = 'Следующее слово';
        }
      } else {
        incorrectAnswers++;

        msg('Почти! Попробуй поменять буквы местами 😉', 'bad');

        filled.forEach((ch, i) => {
          const slot = slotsEl.children[i];

          if (!slot) {
            return;
          }

          slot.style.outline = ch === correct[i]
            ? '2px solid var(--good)'
            : '2px dashed var(--bad)';

          setTimeout(() => {
            slot.style.outline = '';
          }, 600);
        });

        points = Math.max(0, points - 1);
        pointsEl.textContent = points;
      }
    }

    // --- Сообщение ---
    function msg(text, kind) {
      msgEl.className = 'msg ' + (kind || '');
      msgEl.textContent = text || '';
    }

    // --- Кнопки ---
    btnClear.addEventListener('click', clearAll);
    btnShuffle.addEventListener('click', shufflePool);
    btnCheck.addEventListener('click', check);

    btnNext.addEventListener('click', () => {
      idx++;
      loadWord();
    });

    btnRestart.addEventListener('click', startNewGame);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        check();
      }

      if (e.key === 'Escape') {
        clearAll();
      }
    });
  </script>
</body>

</html>
