<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Лестницы: кирпич и вата</title>
<style>
  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    min-height:100vh;
    background:#f6f7fb;
    font-family:system-ui,Arial,sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:10px;
    overflow:hidden;
  }

  .panel{
    width:100%;
    max-width:1120px;
    height:100vh;
    max-height:100vh;
    background:#fff;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.10);
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow:hidden;
  }

  .topRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    flex:0 0 auto;
  }

  .title{
    font-weight:900;
    font-size:clamp(16px, 1.7vw, 20px);
  }

  .score{
    font-size:clamp(14px, 1.5vw, 18px);
    font-weight:900;
    background:#f2f3f6;
    padding:8px 12px;
    border-radius:999px;
  }

  .stats{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    flex:0 0 auto;
  }

  .stat{
    font-size:clamp(13px, 1.3vw, 16px);
    font-weight:800;
    background:#f2f3f6;
    padding:7px 11px;
    border-radius:999px;
  }

  .feedback{
    min-height:24px;
    font-size:clamp(15px, 1.4vw, 18px);
    font-weight:900;
    flex:0 0 auto;
  }

  .good{ color:#16a34a; }
  .bad{ color:#dc2626; }

  .stageRow{
    display:flex;
    gap:12px;
    align-items:stretch;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
  }

  .ladderWrap{
    flex:1 1 0;
    min-width:0;
    border-radius:18px;
    padding:12px;
    position:relative;
    overflow:hidden;
  }

  .hard{
    background:
      linear-gradient(135deg, rgba(154,52,18,.10), rgba(251,146,60,.12)),
      #fff7ed;
    border:3px solid #c2410c;
  }

  .soft{
    background:
      radial-gradient(circle at 18% 22%, rgba(255,255,255,.95) 0 38px, transparent 40px),
      radial-gradient(circle at 78% 26%, rgba(255,255,255,.95) 0 44px, transparent 46px),
      radial-gradient(circle at 42% 76%, rgba(255,255,255,.92) 0 50px, transparent 52px),
      #f0fdf4;
    border:3px solid #86efac;
  }

  .inner{
    position:relative;
    width:100%;
    height:100%;
    min-height:190px;
    border-radius:16px;
    overflow:hidden;
  }

  .decor{
    display:none;
  }

  .stairs{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:3;
    pointer-events:none;
  }

  .stairBlock{
    position:absolute;
  }

  .hard .stairBlock{
    background:
      linear-gradient(90deg, rgba(255,255,255,.35) 2px, transparent 2px),
      linear-gradient(rgba(0,0,0,.14) 2px, transparent 2px),
      #c96f43;
    background-size:26px 38px, 100% 38px;
    border:3px solid #9a3412;
    box-shadow:
      inset 0 -8px 0 rgba(0,0,0,.12),
      0 7px 14px rgba(154,52,18,.18);
  }

  .soft .stairBlock{
    background:
      radial-gradient(circle at 26% 30%, #fff 0 24%, transparent 26%),
      radial-gradient(circle at 70% 36%, #fff 0 30%, transparent 32%),
      radial-gradient(circle at 48% 76%, #fff 0 32%, transparent 34%),
      #dcfce7;
    border:3px solid #86efac;
    border-radius:36%;
    box-shadow:
      inset 0 -5px 0 rgba(22,163,74,.06),
      0 7px 16px rgba(22,163,74,.16);
  }

  .stepZone{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:4;
    transition:transform .12s ease, outline .12s ease;
  }

  .stepZone:empty::after{
    content:"";
    width:var(--slot-size, 52px);
    height:var(--slot-size, 52px);
    border-radius:14px;
    border:4px dashed rgba(255,255,255,.88);
    background:rgba(255,255,255,.24);
  }

  .hard .stepZone{
    background:
      linear-gradient(90deg, rgba(255,255,255,.38) 2px, transparent 2px),
      linear-gradient(rgba(0,0,0,.14) 2px, transparent 2px),
      #c96f43;
    background-size:28px 42px, 100% 42px;
    border:3px solid #9a3412;
    box-shadow:
      inset 0 -8px 0 rgba(0,0,0,.13),
      0 8px 16px rgba(154,52,18,.20);
  }

  .soft .stepZone{
    background:
      radial-gradient(circle at 25% 28%, #fff 0 26%, transparent 28%),
      radial-gradient(circle at 72% 34%, #fff 0 31%, transparent 33%),
      radial-gradient(circle at 48% 74%, #fff 0 33%, transparent 35%),
      #dcfce7;
    border:3px solid #86efac;
    border-radius:36%;
    box-shadow:
      inset 0 -5px 0 rgba(22,163,74,.06),
      0 8px 18px rgba(22,163,74,.18);
  }

  .stepZone.drop-ok{
    outline:5px solid rgba(22,163,74,.65);
    transform:scale(1.04);
  }

  .stepZone.drop-bad{
    outline:5px solid rgba(220,38,38,.65);
    transform:scale(1.04);
  }

  .tray{
    background:#f2f3f6;
    border-radius:16px;
    padding:10px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    min-height:80px;
    flex:0 0 auto;
  }

  .card{
    width:clamp(54px, 5.4vw, 74px);
    height:clamp(54px, 5.4vw, 74px);
    border-radius:16px;
    background:#fff;
    border:2px solid #e6e8ef;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(30px, 3.3vw, 40px);
    font-weight:900;
    user-select:none;
    touch-action:none;
    cursor:grab;
    box-shadow:0 8px 16px rgba(0,0,0,.06);
  }

  .card:active{
    cursor:grabbing;
    transform:scale(.99);
  }

  .card.locked{
    cursor:default;
    border-color:#16a34a;
  }

  .card.disabled{
    pointer-events:none;
  }

  .stepZone .card{
    width:var(--card-size, 58px) !important;
    height:var(--card-size, 58px) !important;
    border-radius:14px !important;
    font-size:var(--card-font, 32px) !important;
    box-shadow:0 5px 10px rgba(0,0,0,.14) !important;
  }

  .restartBtn{
    display:none;
    align-self:center;
    cursor:pointer;
    border:0;
    border-radius:14px;
    padding:10px 16px;
    font-size:16px;
    font-weight:900;
    background:#2563eb;
    color:#fff;
    flex:0 0 auto;
  }

  .overlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(1px);
    cursor:pointer;
    z-index:999;
  }

  .startBtn{
    cursor:pointer;
    border:0;
    border-radius:18px;
    padding:18px 30px;
    font-size:30px;
    font-weight:900;
    background:#16a34a;
    color:#fff;
    box-shadow:0 16px 30px rgba(22,163,74,.25);
  }

  .startBtn:active{
    transform:scale(.99);
  }

  .hidden{
    display:none;
  }

  @media (max-width:700px){
    body{
      overflow:auto;
    }

    .panel{
      height:auto;
      min-height:100vh;
      max-height:none;
    }

    .stageRow{
      flex-direction:column;
      overflow:visible;
    }

    .ladderWrap{
      height:300px;
      flex:none;
    }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="topRow">
    <div class="title">Разложи буквы по лестницам</div>
    <div class="score">Готово: <span id="score">0</span>/10</div>
  </div>

  <div class="stats">
    <div class="stat">Правильные ответы: <span id="correctCount">0</span></div>
    <div class="stat">Ошибки: <span id="incorrectCount">0</span></div>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="stageRow">
    <div class="ladderWrap hard">
      <div class="inner" id="hardInner">
        <div class="decor" id="hardDecor"></div>
        <div class="stairs" id="hardStairs"></div>
      </div>
    </div>

    <div class="ladderWrap soft">
      <div class="inner" id="softInner">
        <div class="decor" id="softDecor"></div>
        <div class="stairs" id="softStairs"></div>
      </div>
    </div>
  </div>

  <div class="tray" id="tray"></div>

  <button class="restartBtn" id="restartBtn" type="button">Начать заново</button>
</div>

<div class="overlay" id="overlay">
  <button class="startBtn" id="startBtn" type="button">НАЧАТЬ</button>
</div>

<script>
  const GAME_ID = 5;

  const SOFT = ["И","Ё","Е","Ю","Я"];
  const HARD = ["Э","Ы","О","У","А"];
  const ALL  = [...SOFT, ...HARD];

  const softSet = new Set(SOFT);
  const hardSet = new Set(HARD);

  const trayEl = document.getElementById("tray");
  const scoreEl = document.getElementById("score");
  const correctCountEl = document.getElementById("correctCount");
  const incorrectCountEl = document.getElementById("incorrectCount");
  const feedbackEl = document.getElementById("feedback");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const restartBtn = document.getElementById("restartBtn");

  const hardInner = document.getElementById("hardInner");
  const softInner = document.getElementById("softInner");
  const hardStairs = document.getElementById("hardStairs");
  const softStairs = document.getElementById("softStairs");

  let started = false;
  let finished = false;

  let score = 0;
  let correctAnswers = 0;
  let incorrectAnswers = 0;
  let startTime = null;
  let resultSaved = false;

  let dragging = null;

  function expectedLadder(letter){
    if (softSet.has(letter)) return "soft";
    if (hardSet.has(letter)) return "hard";
    return null;
  }

  function setFeedback(text, ok = null){
    feedbackEl.textContent = text;
    feedbackEl.className = "feedback" + (ok === null ? "" : (" " + (ok ? "good" : "bad")));
  }

  function beep(ok){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.frequency.value = ok ? 900 : 220;
      gain.gain.value = 0.05;

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.start();

      setTimeout(() => {
        oscillator.stop();
        ctx.close();
      }, 120);
    }catch{}
  }

  function updateScore(){
    scoreEl.textContent = score;
    correctCountEl.textContent = correctAnswers;
    incorrectCountEl.textContent = incorrectAnswers;
  }

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
  }

  function buildCards(){
    trayEl.innerHTML = "";

    const shuffled = shuffle([...ALL]);

    for (const ch of shuffled){
      const card = document.createElement("div");

      card.className = "card";
      card.textContent = ch;
      card.dataset.letter = ch;

      card.addEventListener("pointerdown", onPointerDown);

      trayEl.appendChild(card);
    }
  }

  function getStepSize(innerEl){
    const width = innerEl.clientWidth;
    const height = innerEl.clientHeight;

    const byWidth = Math.floor(width / 4.35);
    const byHeight = Math.floor(height / 3.55);

    return Math.max(44, Math.min(84, byWidth, byHeight));
  }

  function buildStairs(stairsEl, innerEl, ladderName){
    stairsEl.innerHTML = "";

    innerEl.querySelectorAll(`.stepZone[data-ladder="${ladderName}"]`).forEach(zone => {
      zone.remove();
    });

    const STEP = getStepSize(innerEl);
    const GAP_X = Math.round(STEP * 0.82);
    const GAP_Y = Math.round(STEP * 0.62);
    const CONNECTOR = Math.round(STEP * 0.90);

    const platforms = [
      { x: 0 * GAP_X, y: 4 * GAP_Y },
      { x: 1 * GAP_X, y: 3 * GAP_Y },
      { x: 2 * GAP_X, y: 2 * GAP_Y },
      { x: 3 * GAP_X, y: 1 * GAP_Y },
      { x: 4 * GAP_X, y: 0 * GAP_Y },
    ];

    stairsEl.style.width = (4 * GAP_X + STEP) + "px";
    stairsEl.style.height = (4 * GAP_Y + STEP) + "px";

    const stairsRect = stairsEl.getBoundingClientRect();
    const innerRect = innerEl.getBoundingClientRect();

    for (const platform of platforms){
      const zone = document.createElement("div");

      zone.className = "stepZone";
      zone.dataset.ladder = ladderName;

      zone.style.width = STEP + "px";
      zone.style.height = STEP + "px";
      zone.style.borderRadius = ladderName === "soft"
        ? Math.round(STEP * 0.36) + "px"
        : Math.round(STEP * 0.20) + "px";

      zone.style.setProperty("--slot-size", Math.round(STEP * 0.58) + "px");
      zone.style.setProperty("--card-size", Math.round(STEP * 0.72) + "px");
      zone.style.setProperty("--card-font", Math.round(STEP * 0.38) + "px");

      zone.style.left = ((stairsRect.left - innerRect.left) + platform.x) + "px";
      zone.style.top = ((stairsRect.top - innerRect.top) + platform.y) + "px";

      innerEl.appendChild(zone);
    }

    for (let i = 0; i < platforms.length - 1; i++){
      const current = platforms[i];

      const connector = document.createElement("div");

      connector.className = "stairBlock";
      connector.style.width = CONNECTOR + "px";
      connector.style.height = CONNECTOR + "px";
      connector.style.borderRadius = ladderName === "soft"
        ? Math.round(CONNECTOR * 0.36) + "px"
        : Math.round(CONNECTOR * 0.20) + "px";

      connector.style.left = (current.x + Math.round(STEP * 0.52)) + "px";
      connector.style.top = (current.y - Math.round(STEP * 0.15)) + "px";

      stairsEl.appendChild(connector);
    }
  }

  function clearHints(){
    document.querySelectorAll(".stepZone.drop-ok, .stepZone.drop-bad").forEach(zone => {
      zone.classList.remove("drop-ok", "drop-bad");
    });
  }

  function onPointerDown(e){
    if (!started || finished) return;

    const cardEl = e.currentTarget;

    if (cardEl.classList.contains("locked")) return;

    cardEl.setPointerCapture(e.pointerId);

    const rect = cardEl.getBoundingClientRect();
    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;

    const homeParent = cardEl.parentElement;
    const homeNextSibling = cardEl.nextSibling;

    dragging = {
      cardEl,
      letter: cardEl.dataset.letter,
      offsetX,
      offsetY,
      homeParent,
      homeNextSibling
    };

    cardEl.style.pointerEvents = "none";
    cardEl.style.position = "fixed";
    cardEl.style.left = (e.clientX - offsetX) + "px";
    cardEl.style.top  = (e.clientY - offsetY) + "px";
    cardEl.style.zIndex = "1000";

    setFeedback("", null);

    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp, { once:true });
  }

  function onPointerMove(e){
    if (!dragging) return;

    const { cardEl, offsetX, offsetY, letter } = dragging;

    cardEl.style.left = (e.clientX - offsetX) + "px";
    cardEl.style.top  = (e.clientY - offsetY) + "px";

    clearHints();

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const zone = el && el.closest ? el.closest(".stepZone") : null;

    if (zone){
      const need = expectedLadder(letter);
      const ok = (zone.dataset.ladder === need) && zone.children.length === 0;

      zone.classList.add(ok ? "drop-ok" : "drop-bad");
    }
  }

  function returnHome(){
    const { cardEl, homeParent, homeNextSibling } = dragging;

    cardEl.style.position = "";
    cardEl.style.left = "";
    cardEl.style.top = "";
    cardEl.style.zIndex = "";
    cardEl.style.pointerEvents = "";

    if (homeNextSibling) {
      homeParent.insertBefore(cardEl, homeNextSibling);
    } else {
      homeParent.appendChild(cardEl);
    }
  }

  function lockInto(zone){
    const { cardEl } = dragging;

    cardEl.style.position = "";
    cardEl.style.left = "";
    cardEl.style.top = "";
    cardEl.style.zIndex = "";
    cardEl.style.pointerEvents = "";

    cardEl.classList.add("locked");
    zone.appendChild(cardEl);
  }

  function onPointerUp(e){
    window.removeEventListener("pointermove", onPointerMove);

    clearHints();

    if (!dragging) return;

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const zone = el && el.closest ? el.closest(".stepZone") : null;

    if (!zone){
      returnHome();
      dragging = null;
      return;
    }

    if (zone.children.length > 0){
      incorrectAnswers++;
      updateScore();

      setFeedback("Тут уже занято", false);
      beep(false);

      returnHome();
      dragging = null;
      return;
    }

    const need = expectedLadder(dragging.letter);
    const ok = zone.dataset.ladder === need;

    if (ok){
      lockInto(zone);

      score++;
      correctAnswers++;

      updateScore();

      setFeedback("Верно!", true);
      beep(true);

      if (score === ALL.length) {
        finishGame();
      }
    } else {
      incorrectAnswers++;
      updateScore();

      setFeedback("Ошибка", false);
      beep(false);

      returnHome();
    }

    dragging = null;
  }

  function rebuildAll(){
    requestAnimationFrame(() => {
      buildStairs(hardStairs, hardInner, "hard");
      buildStairs(softStairs, softInner, "soft");
    });
  }

  function startGame(){
    if (started) return;

    started = true;
    finished = false;
    resultSaved = false;

    score = 0;
    correctAnswers = 0;
    incorrectAnswers = 0;
    startTime = Date.now();
    dragging = null;

    buildCards();
    updateScore();
    rebuildAll();

    restartBtn.style.display = "none";
    overlay.classList.add("hidden");

    setFeedback("Разложи буквы по подходящим лестницам.", null);
  }

  async function finishGame(){
    if (finished) {
      return;
    }

    finished = true;
    started = false;

    document.querySelectorAll(".card").forEach(card => {
      card.classList.add("disabled");
    });

    const timeSpent = getTimeSpent();

    setFeedback("Отлично! Всё правильно. Сохраняем результат...", true);
    beep(true);

    restartBtn.style.display = "inline-block";

    await saveGameResult(timeSpent);
  }

  function getTimeSpent(){
    if (!startTime) {
      return 0;
    }

    return Math.floor((Date.now() - startTime) / 1000);
  }

  async function saveGameResult(timeSpent){
    if (resultSaved) {
      return;
    }

    resultSaved = true;

    try {
      const response = await fetch('../../save_result.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'same-origin',
        body: JSON.stringify({
          game_id: GAME_ID,
          correct_answers: correctAnswers,
          incorrect_answers: incorrectAnswers,
          time_spent: timeSpent
        })
      });

      const data = await response.json();

      if (data.success) {
        setFeedback(
          `Результат сохранён. Правильно: ${correctAnswers}, ошибок: ${incorrectAnswers}, время: ${timeSpent} сек.`,
          true
        );
      } else {
        setFeedback(
          `Игра завершена, но результат не сохранён: ${data.message}`,
          false
        );
      }
    } catch (error) {
      setFeedback(
        "Игра завершена, но произошла ошибка при сохранении результата.",
        false
      );
    }
  }

  function restartGame(){
    started = false;
    finished = false;
    resultSaved = false;

    score = 0;
    correctAnswers = 0;
    incorrectAnswers = 0;
    startTime = null;
    dragging = null;

    buildCards();
    updateScore();
    rebuildAll();

    restartBtn.style.display = "none";
    overlay.classList.remove("hidden");

    setFeedback("", null);
  }

  startBtn.addEventListener("click", (event) => {
    event.stopPropagation();
    startGame();
  });

  overlay.addEventListener("click", () => startGame());

  restartBtn.addEventListener("click", restartGame);

  buildCards();
  updateScore();
  setFeedback("", null);
  rebuildAll();

  window.addEventListener("resize", () => {
    if (!finished) {
      rebuildAll();
    }
  });
</script>

</body>
</html>
